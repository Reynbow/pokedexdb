<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- DNS prefetch and preconnect for external CDNs -->
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link rel="dns-prefetch" href="https://pokeapi.co" />
    <link rel="preconnect" href="https://pokeapi.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet" />
    <!-- share-meta:start -->
    <link rel="canonical" href="https://pokedexdb.com/" />
    <meta
      name="description"
      content="Your complete Pokemon database with detailed stats, evolutions, abilities, moves, and weakness charts. Plus tools for EV training, move/ability/item databases, save file reading, and a Pokemon guessing minigame."
    />
    <meta name="keywords" content="pokemon, pokedex, pokemon database, pokemon stats, pokemon evolutions, pokemon abilities, pokemon moves, pokemon types, pokemon weaknesses" />
    <meta property="og:site_name" content="Pokedex DB" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pokedexdb.com/" />
    <meta property="og:title" content="Complete Pokemon Database and Tools Website" />
    <meta
      property="og:description"
      content="Your complete Pokemon database with detailed stats, evolutions, abilities, moves, and weakness charts. Plus tools for EV training, move/ability/item databases, save file reading, and a Who's That Pokémon minigame."
    />
    <meta property="og:image" content="https://pokedexdb.com/favicon-og.png" />
    <meta property="og:image:width" content="128" />
    <meta property="og:image:height" content="128" />
    <meta property="og:image:alt" content="Pokedex DB Logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Complete Pokemon Database and Tools Website" />
    <meta
      name="twitter:description"
      content="Your complete Pokemon database with detailed stats, evolutions, abilities, moves, and weakness charts. Plus tools for EV training, move/ability/item databases, save file reading, and a Pokemon guessing minigame."
    />
    <meta name="twitter:image" content="https://pokedexdb.com/favicon-og.png" />
    <title>Complete Pokemon Database and Tools Website</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Pokedex DB",
        "description": "Your complete Pokemon database with detailed stats, evolutions, abilities, moves, and weakness charts. Plus tools for EV training, move/ability/item databases, save file reading, and a Pokemon guessing minigame.",
        "url": "https://pokedexdb.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://pokedexdb.com/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <!-- share-meta:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
