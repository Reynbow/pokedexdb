<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- DNS prefetch and preconnect for external CDNs -->
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link rel="dns-prefetch" href="https://pokeapi.co" />
    <link rel="preconnect" href="https://pokeapi.co" crossorigin />
    <link rel="dns-prefetch" href="https://plausible.io" />
    <link rel="preconnect" href="https://plausible.io" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet" />
    <!-- share-meta:start -->
    <link rel="canonical" href="https://pokedexdb.com/" />
    <meta
      name="description"
      content="Comprehensive Pokédex database with detailed stats, evolutions, abilities, moves, and weakness charts for all Pokemon. Search and filter by type, generation, and more."
    />
    <meta name="keywords" content="pokemon, pokedex, pokemon database, pokemon stats, pokemon evolutions, pokemon abilities, pokemon moves, pokemon types, pokemon weaknesses" />
    <meta property="og:site_name" content="Pokedex DB" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pokedexdb.com/" />
    <meta property="og:title" content="Pokedex DB - Complete Pokemon Database with Stats, Evolutions & Weaknesses" />
    <meta
      property="og:description"
      content="Comprehensive Pokédex database with detailed stats, evolutions, abilities, moves, and weakness charts for all Pokemon. Search and filter by type, generation, and more."
    />
    <meta property="og:image" content="https://pokedexdb.com/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pokedex DB - Complete Pokemon Database" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pokedex DB - Complete Pokemon Database with Stats, Evolutions & Weaknesses" />
    <meta
      name="twitter:description"
      content="Comprehensive Pokédex database with detailed stats, evolutions, abilities, moves, and weakness charts for all Pokemon."
    />
    <meta name="twitter:image" content="https://pokedexdb.com/og-preview.png" />
    <title>Pokedex DB - Complete Pokemon Database with Stats, Evolutions & Weaknesses</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Pokedex DB",
        "description": "Comprehensive Pokédex database with detailed stats, evolutions, abilities, moves, and weakness charts for all Pokemon.",
        "url": "https://pokedexdb.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://pokedexdb.com/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <!-- share-meta:end -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa-rK0z0PRMmTlhbiLBFM0-t.js"></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        };
      plausible.init =
        plausible.init ||
        function (i) {
          plausible.o = i || {};
        };
      plausible.init();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
