<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Embed Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #36393f;
      color: #dcddde;
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 520px;
      margin: 0 auto;
    }
    
    h1 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: 600;
    }
    
    .preview-card {
      background: #2f3136;
      border-left: 4px solid #5865f2;
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    
    .preview-card .site-name {
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 8px;
    }
    
    .preview-card .title {
      color: #00aff4;
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 8px;
      text-decoration: none;
    }
    
    .preview-card .title:hover {
      text-decoration: underline;
    }
    
    .preview-card .description {
      color: #dcddde;
      font-size: 14px;
      line-height: 1.375;
      margin-bottom: 8px;
    }
    
    .preview-card .image-container {
      margin-top: 8px;
      border-radius: 4px;
      overflow: hidden;
      max-width: 400px;
    }
    
    .preview-card .image-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    .meta-info {
      background: #2f3136;
      padding: 16px;
      border-radius: 4px;
      margin-top: 20px;
      font-size: 12px;
      color: #b9bbbe;
    }
    
    .meta-info h2 {
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px;
    }
    
    .meta-info .meta-item {
      margin-bottom: 8px;
      word-break: break-all;
    }
    
    .meta-info .meta-label {
      color: #72767d;
      font-weight: 600;
    }
    
    .refresh-btn {
      background: #5865f2;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 16px;
    }
    
    .refresh-btn:hover {
      background: #4752c4;
    }
    
    .note {
      background: #2f3136;
      padding: 12px;
      border-radius: 4px;
      margin-top: 16px;
      font-size: 12px;
      color: #b9bbbe;
      border-left: 3px solid #faa61a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Discord Rich Preview Preview</h1>
    <button class="refresh-btn" onclick="loadPreview()">Refresh Preview</button>
    
    <div id="preview-card" class="preview-card">
      <div class="site-name" id="site-name">Loading...</div>
      <a href="#" class="title" id="title" target="_blank">Loading...</a>
      <div class="description" id="description">Loading...</div>
      <div class="image-container" id="image-container"></div>
    </div>
    
    <div class="meta-info">
      <h2>Meta Tags Detected:</h2>
      <div id="meta-display">Loading...</div>
    </div>
    
    <div class="note">
      <strong>Note:</strong> This is a local preview. The actual Discord embed may look slightly different. 
      Make sure your dev server is running and accessible at the URL shown above.
    </div>
  </div>

  <script>
    async function loadPreview() {
      try {
        // Get the current page URL or use localhost
        const currentUrl = window.location.origin;
        const response = await fetch(currentUrl);
        const html = await response.text();
        
        // Parse meta tags
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        const ogSiteName = doc.querySelector('meta[property="og:site_name"]')?.content || 'Pokedex DB';
        const ogTitle = doc.querySelector('meta[property="og:title"]')?.content || doc.querySelector('title')?.text || 'Pokedex DB';
        const ogDescription = doc.querySelector('meta[property="og:description"]')?.content || doc.querySelector('meta[name="description"]')?.content || '';
        const ogImage = doc.querySelector('meta[property="og:image"]')?.content || '';
        const ogUrl = doc.querySelector('meta[property="og:url"]')?.content || currentUrl;
        const ogImageAlt = doc.querySelector('meta[property="og:image:alt"]')?.content || 'Preview image';
        
        // Update preview card
        document.getElementById('site-name').textContent = ogSiteName;
        document.getElementById('title').textContent = ogTitle;
        document.getElementById('title').href = ogUrl;
        document.getElementById('description').textContent = ogDescription;
        
        // Handle image
        const imageContainer = document.getElementById('image-container');
        if (ogImage) {
          // Convert relative URLs to absolute
          let imageUrl = ogImage;
          if (ogImage.startsWith('/')) {
            imageUrl = currentUrl + ogImage;
          } else if (!ogImage.startsWith('http')) {
            imageUrl = currentUrl + '/' + ogImage;
          }
          
          imageContainer.innerHTML = `<img src="${imageUrl}" alt="${ogImageAlt}" onerror="this.parentElement.style.display='none'">`;
        } else {
          imageContainer.innerHTML = '';
        }
        
        // Display meta tags
        const metaDisplay = document.getElementById('meta-display');
        const metaTags = [
          { label: 'og:site_name', value: ogSiteName },
          { label: 'og:title', value: ogTitle },
          { label: 'og:description', value: ogDescription },
          { label: 'og:image', value: ogImage },
          { label: 'og:url', value: ogUrl },
          { label: 'og:image:alt', value: ogImageAlt },
        ];
        
        metaDisplay.innerHTML = metaTags.map(tag => 
          `<div class="meta-item">
            <span class="meta-label">${tag.label}:</span> ${tag.value || '(not set)'}
          </div>`
        ).join('');
        
      } catch (error) {
        document.getElementById('preview-card').innerHTML = 
          `<div style="color: #ed4245;">Error loading preview: ${error.message}<br><br>
          Make sure your dev server is running and this page is being served from the same origin.</div>`;
      }
    }
    
    // Load on page load
    loadPreview();
  </script>
</body>
</html>
